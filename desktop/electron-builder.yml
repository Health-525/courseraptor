appId: com.courseraptor.desktop
productName: CourseRaptor
# 关掉 asar：Windows 杀软会把 .asar 当压缩包实时扫描并锁住，导致 EBUSY；
# 且本项目后端本就是明文源码 + node_modules，解开存放与便携包形态一致。
asar: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
# 后端 = buildPortable() 产出的便携包整包 payload.zip（单文件）。
# 不能直接拷 app/、runtime/ 目录树：electron-builder 的拷贝过滤对目录名
# node_modules 是整棵硬丢弃（filter 配什么都没用），目录树进包必然缺依赖；
# 单文件 payload 走 extraResources 畅通无阻，首次启动由主进程解到用户目录
# （见 src/payload.ts），升级按应用版本分目录、旧数据不动。
extraResources:
  - from: build-resources/payload.zip
    to: payload.zip
  # 应用图标直用仓库里的项目 logo（docs/courseraptor-logo.png，与 README 同一张），
  # 不复制第二份避免漂移；运行期主进程从 resources/icon.png 读取
  - from: ../docs/courseraptor-logo.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  icon: ../docs/courseraptor-logo.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 产物名固定无空格：latest.yml 的 url 必须与磁盘/上传文件名逐字一致，
  # 否则 electron-updater 找不到安装包（默认名带空格会被 url 写成连字符）
  artifactName: courseraptor-v${version}-desktop-win-x64-setup.${ext}
portable:
  artifactName: courseraptor-v${version}-desktop-win-x64.${ext}
publish:
  provider: github
  owner: Health-525
  repo: courseraptor
