name: University Adapter
description: Help us assess a potential CourseRaptor integration for another university
title: "[University] "
labels: ["university-adapter"]
body:
  - type: markdown
    attributes:
      value: "Please use public or redacted information only. Do not share accounts, passwords, cookies, student IDs, grade reports, HAR files, or private attachments."
  - type: input
    id: university
    attributes:
      label: University
      placeholder: "Example University"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Academic-system vendor or product (if known)
      placeholder: "Example: Zhengfang / self-built portal"
  - type: textarea
    id: scenarios
    attributes:
      label: First student scenarios to support
      description: "Choose 3–5 read-only scenarios, such as schedule, grades, exams, or notices."
      placeholder: "Schedule by teaching week; upcoming exams; relevant public academic notices."
    validations:
      required: true
  - type: textarea
    id: public_sources
    attributes:
      label: Public sources or documentation
      description: "Public notices, public portal pages, or vendor documentation only. Do not provide login-only URLs or captured authenticated traffic."
  - type: dropdown
    id: contribution
    attributes:
      label: How would you like to help?
      options:
        - I can describe student scenarios and validate fictional fixtures
        - I can contribute documentation or tests
        - I can help implement and maintain an Adapter
        - I am only gauging interest
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this issue contains no credentials or personal academic data.
          required: true
