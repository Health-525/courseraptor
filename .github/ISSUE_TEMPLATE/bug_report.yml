name: 使用问题
description: 启动、查询或界面哪里没有按预期工作
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请使用虚构或脱敏信息；不要上传学号、密码、API Key、Cookie、完整日志或个人成绩单。"
  - type: input
    id: environment
    attributes:
      label: 环境与版本
      description: 操作系统、Node.js 版本、CourseRaptor 版本，以及使用网页还是终端。
      placeholder: "Windows 11 / Node 24 / CourseRaptor 0.1.3 / 网页"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 从启动开始说明具体操作；提问内容请移除个人信息。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期和实际结果
      description: 希望看到什么，实际出现什么；保留脱敏后的错误文字。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 自检结果或脱敏截图（可选）
      description: 可运行 npm run doctor；该检查不会读取凭证内容。不要粘贴 .env。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已确认内容不包含个人凭证、学号或其他私密数据。
          required: true
