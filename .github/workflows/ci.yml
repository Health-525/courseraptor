name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RAPTOR_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: 中文 PDF 测试字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 覆盖率棘轮基线（2026-09 实测 lines 84.5 / branches 82.0 / functions 80.1）：
      # 阈值写进 npm run test:coverage，只升不降；下调前先补测试再改阈值
      - run: npm run test:coverage
      # critical 阻断，high 及以下仅体现在输出里
      # 已知项：image-size（pptxgenjs 传递依赖）2 个 high DoS，等上游出修复版即可消除
      - run: npm run audit:prod

  # 管理台前端（admin/，React + Vite）：构建产物随仓库提交，
  # 这里重新构建并 diff，防止「改了源码忘提交 dist」让服务器拉到旧界面
  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: admin
      - name: Lint
        run: npm run lint
        working-directory: admin
      - name: 构建
        run: npm run build
        working-directory: admin
      - name: 构建产物必须与提交一致
        run: |
          if [ -n "$(git status --porcelain admin/dist)" ]; then
            echo "::error::admin/dist 与源码不一致——请在 admin/ 下 npm run build 并提交产物"
            git status --porcelain admin/dist
            exit 1
          fi

