name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RAPTOR_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: 中文 PDF 测试字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 覆盖率棘轮基线（2026-09 实测 lines 84.5 / branches 82.0 / functions 80.1）：
      # 阈值写进 npm run test:coverage，只升不降；下调前先补测试再改阈值
      - run: npm run test:coverage
      # critical 阻断，high 及以下仅体现在输出里
      # 已知项：image-size（pptxgenjs 传递依赖）2 个 high DoS，等上游出修复版即可消除
      - run: npm run audit:prod
