name: Checks

on:
  # push 只跑 main：分支场景由 pull_request 覆盖，避免「push 分支 + 开 PR」双跑
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RAPTOR_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: 中文 PDF 测试字体
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run lint
      # 复制粘贴检测：阈值棘轮（.jscpd.json threshold），只许变好不许变差
      - run: npm run duplication
      # .env.example 文档与 src/core/config.ts 实现的一致性门禁
      - run: node scripts/verify-env-example.mjs
      # 分层边界门禁：core 不碰 channels/local、channels 不碰 local、adapters 只依赖 core
      - run: node scripts/verify-imports.mjs
      # 覆盖率棘轮基线（2026-09 实测 lines 84.5 / branches 82.0 / functions 80.1）：
      # 阈值写进 npm run test:coverage，只升不降；下调前先补测试再改阈值
      # （test:coverage 本身就会执行全量测试，不再单独跑一遍 npm test）
      - run: npm run test:coverage
      # critical 阻断，high 及以下仅体现在输出里
      # 已治理：xlsx 走 SheetJS 官方 CDN tarball（npm registry 停在 0.18.x，带 CVE）；
      # image-size 经 overrides 钉到 ^2.0.4（pptxgenjs 传递依赖的 high DoS 已消除）。
      # 遗留接受项：sprintf-js（mammoth→argparse 传递依赖）moderate ReDoS，
      # 上游全部版本受影响、无补丁版；且仅 mammoth 的 CLI 路径会用到，程序化调用不触达。
      - run: npm run audit:prod

  # Obsidian 插件子包：独立 lockfile，此前完全不在 CI 内（构建坏了无人知道）
  obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: obsidian/package-lock.json
      - run: npm ci --prefix obsidian
      - run: npm run obsidian:build

  # 桌面版子包：独立 lockfile；只做 typecheck + 主进程打包（不出安装包，
  # 装包需内置 Node 运行时，留给发版流程 scripts/package-desktop.mjs）
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # npm ci 而非 npm install：electron-builder 的 peer 依赖 electron-winstaller
      # 带 win32 限定的 optional 链（@electron/windows-sign 等），ubuntu 上 npm ci
      # 校验 lock 一致性时要求其完整、而任意平台生成 lock 都不会写入——npm install
      # 不做该校验且安装行为一致（lock 基本同步），desktop job 只 typecheck+esbuild
      - run: npm install --prefix desktop --no-audit --no-fund
      - run: npm run desktop:build

